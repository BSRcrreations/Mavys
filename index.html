const I=(n,cl='')=>`<svg class="icon ${cl}" viewBox="0 0 24 24" aria-hidden="true">${paths[n]||paths.plus}</svg>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=()=>({requests:[],availability:{on:true,new:true,guest:true,flex:false,slots:4,window:'14:00–16:00'},pharmacy:'',delivery:0,large:false,contrast:false,voiceAudio:false});
let state;try{state={...initial(),...JSON.parse(localStorage.getItem('mavys-v1')||'{}')}}catch{state=initial()};let role='patient',route='home',filter='all',postal='97469',selectedProvider=0,selectedType='Telephone',selectedWindow='14:00–16:00',guestMode=false,voiceIndex=0,voiceRunning=false,voiceTimer=null,modalRestore=null,toastTimer=null;
const providers=[{name:'Dr. Anna Weber',practice:'Mainbogen Medical Practice',distance:'Gochsheim · local practice',type:'GP · General medicine',guest:true,flex:false,window:'14:00–16:00'},{name:'Dr. Thomas Klein',practice:'MAVYS FlexDoctor',distance:'Remote · telephone or video',type:'GP · Flexible hours',guest:true,flex:true,window:'16:00–18:00'},{name:'Dr. Lea Hoffmann',practice:'Schweinfurt Family Practice',distance:'Schweinfurt · regional practice',type:'GP · General medicine',guest:false,flex:false,window:'Tomorrow, 09:00–11:00'}];
const pharmacies=['Mainbogen Pharmacy (demo)','Village Pharmacy (demo)','Schweinfurt Pharmacy (demo)'];const navs={patient:[['home','home','Overview'],['find','doctor','Find a doctor'],['appointments','calendar','My appointments'],['medication','pill','Medication'],['guest','pin','Away from home'],['help','alert','Help & urgent care'],['settings','settings','Accessibility']],doctor:[['dashboard','grid','Overview'],['queue','list','Patient requests'],['availability','calendar','Availability'],['clinical','file','Care & prescriptions'],['settings','settings','Settings']],voice:[['call','phone','Telephone demo'],['help','shield','Safety & escalation'],['settings','settings','Accessibility']]};
const save=()=>{try{localStorage.setItem('mavys-v1',JSON.stringify(state))}catch{};};const update=()=>{save();render()};window.addEventListener('storage',e=>{if(e.key==='mavys-v1'){try{state={...initial(),...JSON.parse(e.newValue||'{}')};render()}catch{}}});
const latest=()=>state.requests.at(-1);const activeRx=()=>[...state.requests].reverse().find(r=>['prescribed','delivered'].includes(r.status));const statusName=s=>({pending:'Awaiting confirmation',accepted:'Callback confirmed',reviewed:'Reviewed by doctor',prescribed:'Prescription simulated',delivered:'Delivery complete',redirected:'Redirected',cancelled:'Cancelled'}[s]||s);const tag=(text,kind='')=>`<span class="tag ${kind}"><span class="dot"></span>${esc(text)}</span>`;const btn=(label,action,icon='',cl='',attr='')=>`<button class="btn ${cl}" data-act="${action}" ${attr}>${icon?I(icon):''}${label}</button>`;const link=(label,action)=>`<button class="link-btn" data-act="${action}">${label}${I('chevron')}</button>`;const nav=(r)=>navs[role].map(([key,ico,label])=>`<button class="${r===key?'active':''}" data-act="nav:${key}" ${r===key?'aria-current="page"':''}>${I(ico)}<span>${label}</span></button>`).join('');const heading=(label,title,desc,extra='')=>`<div class="page-head"><div><div class="eyebrow" style="margin-bottom:10px">${label}</div><h1>${title}</h1><p class="muted">${desc}</p></div>${extra}</div>`;const section=(title,action='',label='View all')=>`<div class="section-head"><h2>${title}</h2>${action?link(label,action):''}</div>`;const tile=(ico,title,desc,action)=>`<button class="tile" data-act="${action}"><div class="tile-top"><span class="circle-icon">${I(ico)}</span>${I('arrow','arrow')}</div><div><h3>${title}</h3><p>${desc}</p></div></button>`;const notice=()=>`<div class="notice emergency">${I('alert')}<div><h3>Need help now?</h3><p><a href="tel:112">112</a> for life-threatening emergencies. <a href="tel:116117">116117</a> for urgent, non-life-threatening care. This demo does not contact either service.</p></div></div>`;
const art=`<svg class="hero-art" viewBox="0 0 420 300" fill="none" aria-hidden="true"><circle cx="254" cy="153" r="123" fill="#255b45"/><circle cx="254" cy="153" r="104" stroke="#7da98b" stroke-opacity=".36"/><circle cx="254" cy="153" r="86" stroke="#7da98b" stroke-opacity=".3"/><path d="M0 239 100 162l78 52 82-64 160 86v64H0Z" fill="#56856a"/><path d="m30 275 93-54 92 27 96-49 109 43v58H0Z" fill="#90ac81"/><path d="M0 288q120-52 240 2t180-18v28H0Z" fill="#b4cc95"/><g class="pulse"><rect x="210" y="65" width="102" height="139" rx="25" fill="#f1f6df"/><rect x="217" y="73" width="88" height="123" rx="19" fill="#d8e9ca"/><rect x="246" y="80" width="30" height="5" rx="2.5" fill="#547e62"/><circle cx="261" cy="130" r="30" fill="#255b45"/><path d="M246 126q0-11 10-11 5 0 5 5 4-7 10-5 11 4 2 15l-12 12-13-13Z" fill="#d9edb5"/><path d="M239 129h12l4-7 5 13 4-6h17" stroke="#255b45" stroke-width="2.5" stroke-linecap="round"/><rect x="235" y="169" width="52" height="7" rx="3.5" fill="#7da98b"/></g><g transform="translate(124 195)"><path d="m0 20 30-24 30 24v38H0Z" fill="#e9edcf"/><path d="m-5 22 35-30 35 30" stroke="#315b48" stroke-width="7" stroke-linecap="round"/><rect x="23" y="37" width="14" height="21" rx="2" fill="#6b9472"/><rect x="7" y="29" width="10" height="10" rx="2" fill="#9db68b"/></g><path d="M346 233v-49m-12 28 12-31 12 31" stroke="#315b48" stroke-width="5" stroke-linecap="round"/><circle cx="346" cy="174" r="21" fill="#779b72"/><circle cx="330" cy="110" r="7" fill="#d9edb5"/><path d="M161 100v17m-8-8h16M329 57v14m-7-7h14" stroke="#c6e1a9" stroke-width="2" stroke-linecap="round"/></svg>`;
function render(){document.body.classList.toggle('large-text',state.large);document.body.classList.toggle('contrast',state.contrast);const roles=[['patient','user','Patient'],['doctor','doctor','Doctor'],['voice','phone','Voice']];const current=navs[role].find(x=>x[0]===route)?.[2]||'Overview';const screen=role==='patient'?({home:home,find:find,appointments:appointments,medication:medication,guest:guest,help:help,settings:settings}[route]||home)():role==='doctor'?({dashboard:doctorHome,queue:queue,availability:availability,clinical:clinical,settings:settings}[route]||doctorHome)():({call:voice,help:help,settings:settings}[route]||voice)();document.getElementById('app').innerHTML=`<div class="shell"><aside class="side"><button class="logo" data-act="role:patient" aria-label="MAVYS home"><span class="mark">${I('heart')}</span><span class="logo-word">mavys.</span></button><div class="brand-sub">Care, closer to home.</div><div class="eyebrow nav-label">${role==='doctor'?'Practice workspace':role==='voice'?'Voice workspace':'Your healthcare'}</div><nav class="nav" aria-label="Main navigation">${nav(route)}</nav><div class="sidebar-bottom"><div class="help-tile"><span class="eyebrow">No smartphone?</span><h3>Care is one call away.</h3><p class="small muted">Try our landline assistant.</p><button class="btn secondary smallbtn" data-act="role:voice">${I('phone')} Voice demo</button></div><span class="demo-label">THWS START-A-THON · DEMO</span></div></aside><main><header class="top"><div class="top-left">${I('pin')}<span class="where">Gochsheim, Bavaria</span><span class="muted">/</span><span>${current}</span></div><div class="mobile-brand">mavys.</div><div class="top-right"><div class="role-switch" aria-label="Switch demo portal">${roles.map(([r,ico,l])=>`<button class="${role===r?'active':''}" aria-pressed="${role===r}" data-act="role:${r}">${I(ico)}${l}</button>`).join('')}</div><button class="iconbtn" data-act="notifications" aria-label="Notifications">${I('bell')}</button><button class="iconbtn" data-act="nav:settings" aria-label="Accessibility">${I('settings')}</button><div class="avatar" title="Fictional demo profile">${role==='doctor'?'AW':'MS'}</div></div></header><div class="content"><div class="demo-strip"><span><span class="status-dot"></span> Interactive demo · fictional data</span><button class="link-btn" data-act="reset">${I('refresh')} Reset demo</button></div><div class="page">${screen}</div></div></main><nav class="mobile-nav" aria-label="Mobile navigation">${navs[role].slice(0,role==='patient'?5:4).map(([key,ico,l])=>`<button class="${route===key?'active':''}" data-act="nav:${key}">${I(ico)}<span>${key==='appointments'?'Bookings':key==='find'?'Doctors':key==='guest'?'Travel':l}</span></button>`).join('')}</nav></div>`;if(route==='call'){const t=document.querySelector('.transcript');if(t)t.scrollTop=t.scrollHeight}}
function home(){const r=latest();return heading('Friday · 27 November','Good afternoon, Maria.','Healthcare made simpler, wherever you call home.',`<span class="date-chip">${I('shield')} Your care, your choice</span>`)+`<div class="dashboard"><div class="stack"><div class="hero"><div class="hero-copy"><div class="eyebrow">Care without the commute</div><h2>A doctor, closer than you think.</h2><p>Find a participating doctor or request a callback from the comfort of your home.</p>${btn('Find a doctor','nav:find','arrow','light')}</div>${art}</div><section>${section('How can we help?')}<div class="tiles">${tile('phone','Request a callback','No travel or video needed.','callback')}${tile('pill','My medication','Prescriptions and home delivery.','nav:medication')}${tile('pin','Away from home','Find care while travelling.','nav:guest')}${tile('users','Help someone else','Arrange care with their permission.','caregiver')}</div></section></div><div class="stack"><div class="card appointment"><div class="card-title"><div><div class="eyebrow">Your care</div><h2 style="margin-top:6px">Next appointment</h2></div>${r?tag(statusName(r.status),r.status==='pending'?'warn':'neutral'):tag('No booking','neutral')}</div>${r&&!['cancelled','redirected'].includes(r.status)?`<div class="info"><span class="doctor-avatar">${I('doctor')}</span><div><h3>${esc(r.doctor)}</h3><p class="small muted">${esc(r.type)} consultation</p></div></div><div class="details"><div class="row">${I('clock')}${esc(r.window)}</div><div class="row">${I('phone')}${r.status==='pending'?'Practice will confirm your request':'Follow the practice instructions'}</div></div>${btn('View appointment','nav:appointments','arrow','secondary full')}`:`<div class="empty"><span class="circle-icon">${I('calendar')}</span><h3>Nothing booked yet</h3><p class="small">We will show your next appointment here.</p>${btn('Request appointment','nav:find','','secondary full')}</div>`}</div><div class="card"><div class="card-title"><div><div class="eyebrow">Stay informed</div><h2 style="margin-top:6px">Care journey</h2></div>${I('heart')}</div>${journey(r)}</div>${notice()}</div></div>`}
function journey(r){let n=r?({pending:0,accepted:1,reviewed:2,prescribed:2,delivered:3}[r.status]??-1):-1;return `<div class="timeline">${[['Request sent','Your request reaches a practice'],['Practice confirms','A callback or appointment is agreed'],['Doctor consultation','The clinician decides the next step'],['Medication at home','If prescribed and delivery arranged']].map(([a,b],i)=>`<div class="step ${i<n?'done':i===n?'current':''}"><span class="step-icon">${I(i<n?'check':['file','calendar','doctor','truck'][i])}</span><div><h3>${a}</h3><p>${b}</p></div></div>`).join('')}</div>`}
function find(){const arr=providers.map((p,i)=>({...p,i})).filter(p=>{if(p.i===0&&(!state.availability.on||(!state.availability.new&&!guestMode)||(guestMode&&!state.availability.guest)||state.availability.slots<1))return false;if(guestMode&&!p.guest)return false;if(filter==='flex'&&!p.flex)return false;if(filter==='local'&&p.flex)return false;return true});return heading(guestMode?'GuestCare':'Find care','Find your next doctor.','Choose how you want to receive care. Availability is illustrative.')+`<div class="stack"><div class="card flow"><div class="search"><div class="field"><label for="postal">Your current postcode</label><input id="postal" inputmode="numeric" maxlength="5" value="${esc(postal)}" placeholder="e.g. 97469"></div>${btn('Search doctors','search','pin')}</div><div class="choices">${[['all','All doctors'],['local','Local practices'],['flex','FlexDoctors']].map(([k,l])=>`<button class="choice ${filter===k?'selected':''}" data-act="filter:${k}">${l}</button>`).join('')}</div><p class="small muted">Pilot directory · Gochsheim / Schweinfurt · No live location or availability data.</p></div>${section(`${arr.length} participating demo doctors`)}<div class="three">${arr.map(p=>`<div class="card provider-card"><div class="row"><span class="doctor-avatar">${I('doctor')}</span><div><h3>${p.name}</h3><p class="small muted">${p.type}</p></div></div><div>${tag('Open to requests')}${p.flex?' '+tag('FlexDoctor','neutral'):''}</div><p class="small muted">${p.practice}<br>${p.distance}</p><div class="details"><div class="row">${I('clock')}${p.i===0?esc(state.availability.window):p.window}</div><div class="row">${I('phone')} Telephone / video${p.flex?'':' / visit'}</div><div class="row">${I('users')}${p.guest?'Accepts visiting patients':'Local patients'}</div></div>${btn('Request consultation','book:'+p.i,'arrow')}</div>`).join('')||'<div class="card empty">No matching demo doctors. Try another filter.</div>'}</div>${notice()}</div>`}
function appointments(){return heading('My care','Your appointments.','Follow requests and confirmations in one place.')+`<div class="wide stack">${state.requests.length?[...state.requests].reverse().map(r=>`<div class="card flow"><div class="row"><span class="doctor-avatar">${I('doctor')}</span><div class="spacer"><h2 style="font-size:20px">${esc(r.doctor)}</h2><p class="small muted">${esc(r.type)} · ${esc(r.window)}</p></div>${tag(statusName(r.status),r.status==='pending'?'warn':'neutral')}</div><div class="summary"><p>${I('file')} ${esc(r.reason)}</p><p class="small muted">Request #${esc(r.id)} · ${esc(r.source)} · ${esc(r.postal)}</p></div>${['pending','accepted'].includes(r.status)?`<div class="button-group">${btn('Cancel request','cancel:'+r.id,'x','outline')}${r.status==='pending'?btn('Change callback window','reschedule:'+r.id,'clock','secondary'):''}</div>`:''}</div>`).join(''):`<div class="card empty"><span class="circle-icon">${I('calendar')}</span><h3>No appointments yet</h3><p>Request a consultation to begin.</p>${btn('Find a doctor','nav:find','arrow')}</div>`}${btn('New appointment','nav:find','plus','secondary')}</div>`}
function medication(){const rx=activeRx();const stages=[['Choose pharmacy','Select a pharmacy yourself'],['Pharmacy confirms','Stock and delivery checked'],['Preparing delivery','Pharmacy-managed courier'],['Delivered','Handover completed']];return heading('My medication','Medication, made easier.','From a clinician-approved prescription to your doorstep.')+`<div class="dashboard"><div class="stack"><div class="card flow"><div class="row"><span class="circle-icon">${I('file')}</span><div><h2>My prescriptions</h2><p class="small muted">A doctor must review every request.</p></div></div>${rx?`<div class="summary"><div class="row"><div class="spacer"><h3>Simulated e-prescription</h3><p class="small muted">Issued in demo by ${esc(rx.doctor)}</p></div>${tag('Demo only')}</div><p>No real medication, prescription or redeemable code is generated.</p></div>`:`<div class="empty"><span class="circle-icon">${I('pill')}</span><h3>No prescription available</h3><p class="small">Ask your practice to review a repeat-prescription request.</p></div>`}${btn('Request prescription review','repeat','plus','secondary full')}</div><div class="card flow"><div class="row"><span class="circle-icon">${I('pin')}</span><div><h2>Choose your pharmacy</h2><p class="small muted">You always have the right to choose.</p></div></div><div class="field"><label for="pharmacy">Participating pharmacies (fictional)</label><select id="pharmacy" ${!rx?'disabled':''}><option value="">Select a pharmacy</option>${pharmacies.map(p=>`<option ${state.pharmacy===p?'selected':''}>${p}</option>`).join('')}</select></div>${btn('Request home delivery','delivery-request','truck','full',!rx||!state.pharmacy||state.delivery>0?'disabled':'')}${state.delivery>0?`<p class="pill-note">Delivery requested from ${esc(state.pharmacy)}. Pharmacy confirmation required.</p>`:''}<p class="small muted">Delivery depends on stock, counselling, recipient availability and pharmacy capacity.</p></div></div><div class="stack"><div class="card flow"><div class="card-title"><div><div class="eyebrow">Live demo status</div><h2 style="margin-top:5px">Delivery journey</h2></div>${I('truck')}</div><div class="statusbar"><span style="width:${state.delivery*25}%"></span></div><div class="timeline">${stages.map(([a,b],i)=>`<div class="step ${state.delivery>i?'done':state.delivery===i&&state.delivery?'current':''}"><span class="step-icon">${I(state.delivery>i?'check':['pin','bag','truck','home'][i])}</span><div><h3>${a}</h3><p>${b}</p></div></div>`).join('')}</div>${state.delivery>0&&state.delivery<4?btn(['','Simulate pharmacy confirmation','Simulate dispatch','Simulate handover'][state.delivery],'delivery-next','arrow','secondary full'):''}${state.delivery===4?tag('Delivery completed'):''}<p class="small muted">Simulation only · no logistics integration.</p></div>${notice()}</div></div>`}
function guest(){return heading('GuestCare','Away from home?','Find a participating practice willing to accept visiting patients.')+`<div class="wide stack"><div class="hero"><div class="hero-copy"><div class="eyebrow">Care travels with you</div><h2>New place. Same peace of mind.</h2><p>Request help in your current region, subject to practice capacity.</p>${btn('Find visiting-patient care','guest-find','arrow','light')}</div>${art}</div><div class="card flow"><h2>Where are you now?</h2><div class="field"><label for="guest-postal">Current postcode</label><input id="guest-postal" inputmode="numeric" maxlength="5" value="${esc(postal)}"></div>${btn('Search for GuestCare','guest-find','pin') }<p class="small muted">This prototype uses the Schweinfurt pilot directory. Real coverage would be activated postcode by postcode.</p></div>${notice()}</div>`}
function help(){return heading('Safety first','Find the right help.','If you need urgent assistance, use the existing public services.')+`<div class="wide stack"><div class="card flow"><div class="row"><span class="circle-icon" style="background:#fae6e1;color:#9b3735">${I('alert')}</span><div class="spacer"><h2>112 · Emergency</h2><p class="muted">Life-threatening situations. Call immediately.</p></div></div><a class="btn danger" href="tel:112">${I('phone')} Call 112</a></div><div class="card flow"><div class="row"><span class="circle-icon">${I('doctor')}</span><div><h2>116117 · Medical on-call service</h2><p class="muted">Urgent, non-life-threatening care when practices are closed.</p></div></div><a class="btn" href="https://www.116117.de/" target="_blank" rel="noopener">Visit 116117.de ${I('arrow')}</a><a class="btn secondary" href="tel:116117">${I('phone')} Call 116117</a></div><div class="card flow"><div class="row"><span class="circle-icon">${I('pill')}</span><div><h2>Emergency pharmacy</h2><p class="muted">Find the pharmacy currently on duty.</p></div></div><a class="btn secondary" href="https://www.aponet.de/apotheke/notdienstsuche" target="_blank" rel="noopener">Find emergency pharmacy ${I('arrow')}</a></div></div>`}
function toggle(key,title,desc,value){return `<button class="switch" role="switch" aria-checked="${value}" data-act="toggle:${key}"><div class="info"><h3>${title}</h3><small>${desc}</small></div><span class="track"></span></button>`}
function settings(){return heading('Accessibility','Make MAVYS yours.','Choose the interface that works best for you.')+`<div class="wide stack"><div class="card flow"><h2>Display & comfort</h2>${toggle('large','Larger text','Increase reading size across the application.',state.large)}<div class="divider"></div>${toggle('contrast','Higher contrast','Stronger text and borders.',state.contrast)}<div class="divider"></div>${toggle('voiceAudio','Voice playback','Play simulated assistant lines using browser speech synthesis when available.',state.voiceAudio)}</div><div class="card flow"><h2>About this demo</h2><p class="muted">No live patient records, real prescriptions, doctor accounts, or calls. Demo data is stored locally in your browser. Use fictional information only.</p>${btn('Reset all demo data','reset','refresh','outline')}</div>${notice()}</div>`}
function metric(ico,num,label){return `<div class="card metric"><span class="circle-icon">${I(ico)}</span><div class="num">${num}</div><div class="small muted">${label}</div></div>`}
function doctorHome(){const pend=state.requests.filter(r=>r.status==='pending');return heading('Provider workspace','Good afternoon, Dr. Weber.','Manage your availability and respond to patient requests.',tag(state.availability.on?'Accepting requests':'Unavailable',state.availability.on?'':'warn'))+`<div class="stack"><div class="three metrics">${metric('list',pend.length,'Pending requests')}${metric('calendar',state.requests.filter(r=>r.status==='accepted').length,'Confirmed callbacks')}${metric('clock',state.availability.on?state.availability.slots:0,'Open slots')}</div><div class="dashboard"><div class="stack"><div class="card"><div class="card-title"><div><div class="eyebrow">Your inbox</div><h2 style="margin-top:6px">Patient requests</h2></div>${link('View queue','nav:queue')}</div>${pend.length?pend.map(requestRow).join(''):`<div class="empty"><span class="circle-icon">${I('list')}</span><h3>You're all caught up</h3><p class="small">Start a telephone demo to see an incoming request.</p>${btn('Try telephone assistant','role:voice','phone','secondary')}</div>`}</div><div class="card flow"><div class="row"><span class="circle-icon">${I('spark')}</span><div><h2>AI-assisted intake</h2><p class="small muted">Administrative summaries only.</p></div></div><p class="muted">Requests from the patient portal and landline assistant appear in your shared inbox. Clinical judgement remains yours.</p>${btn('Review care workflow','nav:clinical','arrow','secondary')}</div></div><div class="stack"><div class="card flow"><h2>Your availability</h2>${toggle('on','Accept requests','Show your practice in the demo directory.',state.availability.on)}${toggle('new','New patients','Accept new local patients.',state.availability.new)}${toggle('guest','Visiting patients','Participate in GuestCare.',state.availability.guest)}${toggle('flex','FlexDoctor mode','Flexible hours for eligible doctors.',state.availability.flex)}${btn('Manage schedule','nav:availability','calendar','secondary full')}</div><div class="notice">${I('shield')}<div><h3>Clinician in control</h3><p>All medical decisions are made by authorised clinicians. This interface is a simulation.</p></div></div></div></div></div>`}
function requestRow(r){return `<div class="list-row"><span class="avatar">${esc(r.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span><div class="info"><h3>${esc(r.name)}</h3><p>${esc(r.source)} · ${esc(r.type)} · ${esc(r.postal)}</p><p>${esc(r.reason)}</p></div>${tag(statusName(r.status),r.status==='pending'?'warn':'neutral')}${btn('Review','review:'+r.id,'chevron','secondary smallbtn')}</div>`}
function queue(){return heading('Patient requests','Your patient inbox.','Review requests from the web and telephone assistant.')+`<div class="wide stack"><div class="card">${state.requests.length?[...state.requests].reverse().map(requestRow).join(''):`<div class="empty"><span class="circle-icon">${I('list')}</span><h3>No requests yet</h3>${btn('Run telephone demo','role:voice','phone','secondary')}</div>`}</div></div>`}
function availability(){return heading('Schedule','Set your availability.','Give patients a realistic callback window.')+`<div class="wide stack"><div class="card flow"><h2>Consultation settings</h2>${toggle('on','Available for requests','Display the practice in the directory.',state.availability.on)}${toggle('new','Accept new patients','Local residents who are not yet registered.',state.availability.new)}${toggle('guest','Accept visiting patients','Patients temporarily away from home.',state.availability.guest)}${toggle('flex','FlexDoctor participation','Requires credential and billing approval in real deployment.',state.availability.flex)}<div class="divider"></div><div class="two"><div class="field"><label for="slots">Maximum remaining demo slots</label><input id="slots" type="number" min="0" max="30" value="${state.availability.slots}"></div><div class="field"><label for="window">Callback window</label><select id="window">${['09:00–11:00','11:00–13:00','14:00–16:00','16:00–18:00','Tomorrow, 09:00–11:00'].map(x=>`<option ${state.availability.window===x?'selected':''}>${x}</option>`).join('')}</select></div></div>${btn('Save schedule','save-availability','check')}</div></div>`}
function clinical(){const arr=state.requests.filter(r=>['accepted','reviewed','prescribed','delivered'].includes(r.status));return heading('Clinical workflow','Care & prescriptions.','Simulate the handover after clinician review.')+`<div class="wide stack"><div class="notice">${I('shield')}<div><h3>Demonstration only</h3><p>Real consultations and e-prescriptions must use authorised clinical systems. This prototype does not issue prescriptions.</p></div></div>${arr.length?arr.map(r=>`<div class="card flow">${requestRow(r)}<div class="button-group">${r.status==='accepted'?btn('Mark consultation reviewed','complete:'+r.id,'check'):''}${r.status==='reviewed'?btn('Simulate approved e-prescription','rx:'+r.id,'file'):''}${['prescribed','delivered'].includes(r.status)?tag('Prescription workflow simulated'):''}</div></div>`).join(''):`<div class="card empty"><span class="circle-icon">${I('file')}</span><h3>No confirmed cases</h3><p class="small">Accept a patient request first.</p>${btn('Open patient queue','nav:queue','arrow','secondary')}</div>`}</div>`}
const conversation=()=>{const available=state.availability.on&&state.availability.new&&state.availability.slots>0;return [['assistant','Hello, welcome to MAVYS. If this is a life-threatening emergency, please call 112. How can I help with your routine healthcare request?'],['patient','Hello. I am Maria Schneider. My family doctor retired, and I cannot travel to the city. I would like a routine follow-up.'],['assistant','Of course. What is your current postcode and preferred way to speak to a doctor?'],['patient','97469. A telephone callback would be best.'],['assistant',available?`Dr. Anna Weber’s practice is accepting requests. The available callback window is ${state.availability.window}. Shall I send your request for confirmation?`:'Dr. Anna Weber’s practice is not accepting new requests right now. I cannot promise a callback. Would you like to look for another participating practice?'],['patient',available?'Yes, please use my demo callback number. Thank you.':'Yes, thank you.'],['assistant',available?'Your request is ready. I will send it to the practice. The doctor will decide the next step.':'I will show other participating practices. For urgent care that cannot wait, call 116117.']];};
function voice(){const lines=conversation();return heading('MAVYS Voice','One call changes everything.','Experience how a resident with an ordinary telephone can request care.',tag('Simulated call','neutral'))+`<div class="voice-layout"><div class="voice-stage"><span class="eyebrow" style="color:#d0e5ca">Landline accessibility</span><div class="orb ${voiceRunning?'live':''}">${I('phone')}</div><div class="wave ${voiceRunning?'live':''}">${Array.from({length:13},(_,i)=>`<i style="--i:${i}"></i>`).join('')}</div><h2>${voiceRunning?'Conversation in progress':voiceIndex===lines.length?'Conversation complete':'Ready to connect'}</h2><p>Maria Schneider · 78 years old<br>No smartphone required</p><div class="button-group">${voiceRunning?btn('Pause','voice-pause','phone','light'):voiceIndex===0?btn('Start demo call','voice-start','phone','light'):voiceIndex<lines.length?btn('Continue call','voice-start','phone','light'):btn('Replay call','voice-replay','refresh','light')}${btn(state.voiceAudio?'Sound on':'Sound off','toggle:voiceAudio','volume','outline')}</div><p class="small">Scripted simulation · no real telephone call</p></div><div class="card flow"><div class="card-title"><div><div class="eyebrow">Live conversation</div><h2 style="margin-top:6px">Call transcript</h2></div>${tag(`${voiceIndex}/${lines.length}`,'neutral')}</div><div class="transcript" aria-live="polite">${voiceIndex?lines.slice(0,voiceIndex).map(([who,msg])=>`<div class="bubble ${who==='patient'?'patient':''}"><strong>${who==='patient'?'Maria · Landline':'MAVYS assistant'}</strong>${esc(msg)}</div>`).join(''):`<div class="empty"><span class="circle-icon">${I('mic')}</span><p>Start the demo to watch the conversation unfold.</p></div>`}</div><div class="statusbar"><span style="width:${voiceIndex/lines.length*100}%"></span></div>${voiceIndex===lines.length?state.availability.on&&state.availability.new&&state.availability.slots>0?btn('Send request to doctor','voice-send','arrow','full',state.requests.some(r=>r.source==='Landline demo'&&r.status!=='cancelled')?'disabled':''):btn('Find another practice','patient-find','arrow','full'):btn('Next conversation step','voice-next','chevron','secondary full',voiceRunning?'disabled':'')}${state.requests.some(r=>r.source==='Landline demo')?btn('Open doctor inbox','doctor-queue','list','secondary full'):''}<p class="small muted">No autonomous diagnosis, triage or prescribing.</p></div></div>`}
function speak(text){if(state.voiceAudio&&'speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.95;speechSynthesis.speak(u)}}function voiceStep(){const lines=conversation();if(voiceIndex>=lines.length){voiceRunning=false;render();return}const [who,text]=lines[voiceIndex++];if(who==='assistant')speak(text);if(voiceIndex===lines.length)voiceRunning=false;render();if(voiceRunning)voiceTimer=setTimeout(voiceStep,Math.min(7500,Math.max(1600,text.length*(state.voiceAudio?58:21))))}function stopVoice(){clearTimeout(voiceTimer);voiceRunning=false;if('speechSynthesis'in window)speechSynthesis.cancel()}
function go(r,p){if(role==='voice'&&(r!=='voice'||p!=='call'))stopVoice();role=r;route=p;closeModal(false);render();window.scrollTo({top:0,behavior:'instant'});}function toast(msg){clearTimeout(toastTimer);document.getElementById('toast-root').innerHTML=`<div class="toast">${I('checkcircle')}${esc(msg)}</div>`;toastTimer=setTimeout(()=>document.getElementById('toast-root').innerHTML='',3500)}
function modal(title,body){modalRestore=document.activeElement;document.getElementById('overlay').innerHTML=`<div class="modal-wrap" data-act="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="modal-head"><h2 id="dialog-title">${title}</h2><button class="iconbtn" data-act="close" aria-label="Close dialog">${I('x')}</button></div>${body}</section></div>`;document.querySelector('.modal .iconbtn').focus()}
function closeModal(restore=true){document.getElementById('overlay').innerHTML='';if(restore&&modalRestore?.isConnected)modalRestore.focus();modalRestore=null}
function book(i,kind='booking'){selectedProvider=i;const p=providers[i];selectedType=kind==='repeat'?'Prescription review':'Telephone';selectedWindow=i===0?state.availability.window:p.window;modal(kind==='repeat'?'Request prescription review':'Request a consultation',`<form id="booking-form" class="flow"><div class="summary"><div class="row"><span class="doctor-avatar">${I('doctor')}</span><div><h3>${p.name}</h3><p class="small muted">${p.practice} · fictional</p></div></div></div><div class="field"><label for="patient-name">Patient name (demo only)</label><input id="patient-name" required maxlength="60" value="Maria Schneider"></div><div class="field"><label for="callback-number">Callback number (fictional)</label><input id="callback-number" type="tel" required maxlength="25" value="000 000000"></div><div class="field"><label for="type">Consultation type</label><select id="type">${(kind==='repeat'?['Prescription review']:p.flex?['Telephone','Video']:['Telephone','Video','In person']).map(t=>`<option ${selectedType===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="time">Preferred callback / appointment window</label><select id="time"><option>${esc(selectedWindow)}</option><option>Next working day</option></select></div><div class="field"><label for="reason">Reason for request (demo)</label><textarea id="reason" maxlength="160" required>${kind==='repeat'?'Routine repeat-prescription review':'Routine follow-up; no transport available.'}</textarea></div><p class="small muted">Your request is not a confirmed appointment. No clinical assessment is made here. Do not enter real personal or medical data.</p><button class="btn full" type="submit">${I('check')} Send request</button></form>`)}
function addRequest(data){const id=String(Date.now()).slice(-8);state.requests.push({id,status:'pending',...data});save();return id}
function review(id){const r=state.requests.find(x=>x.id===id);if(!r)return;modal('Review patient request',`<div class="flow"><div class="row"><span class="avatar">${esc(r.name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span><div class="spacer"><h3>${esc(r.name)}</h3><p class="small muted">${esc(r.source)} · ${esc(r.postal)}</p></div>${tag(statusName(r.status))}</div><div class="summary"><div class="row">${I('spark')}<h3>Administrative intake summary</h3></div><p><strong>Request:</strong> ${esc(r.reason)}</p><p><strong>Preferred contact:</strong> ${esc(r.type)} · ${esc(r.window)}</p><p><strong>Callback:</strong> ${esc(r.callback)}</p><p><strong>Assigned practice:</strong> ${esc(r.doctor)}</p><p class="small muted">Patient-provided information. Not a diagnosis or medical triage result.</p></div>${r.status==='pending'?`<div class="button-group">${btn('Accept request','accept:'+id,'check','',r.doctor===providers[0].name&&(!state.availability.on||state.availability.slots<1)?'disabled':'')}${btn('Redirect request','redirect:'+id,'arrow','outline')}</div>`:r.status==='accepted'?btn('Mark consultation reviewed','complete:'+id,'check'):r.status==='reviewed'?btn('Simulate approved e-prescription','rx:'+id,'file'):''}</div>`)}
function onAction(a){const [k,v]=a.split(':');switch(k){case'role':go(v,v==='patient'?'home':v==='doctor'?'dashboard':'call');break;case'nav':if(v==='find'){guestMode=false;filter='all'}go(role,v);break;case'patient-find':guestMode=false;filter='all';go('patient','find');break;case'doctor-queue':go('doctor','queue');break;case'guest-find':{const p=document.getElementById('guest-postal')?.value||postal;if(!/^\d{5}$/.test(p)){toast('Enter a valid five-digit postcode.');return}postal=p;guestMode=true;filter='all';go('patient','find');break}case'search':{const p=document.getElementById('postal').value;if(!/^\d{5}$/.test(p)){toast('Enter a valid five-digit postcode.');return}postal=p;render();toast('Showing illustrative pilot-directory results.');break}case'filter':filter=v;render();break;case'book':book(Number(v));break;case'callback':{if(state.availability.on&&state.availability.new&&state.availability.slots>0)book(0);else{guestMode=false;filter='all';go('patient','find');toast('Main practice unavailable. Choose an alternative.')}break}case'repeat':{if(state.availability.on&&state.availability.slots>0)book(0,'repeat');else{go('patient','find');toast('Choose an available practice for review.')}break}case'caregiver':modal('Help someone you care about',`<div class="flow"><p>With their permission, you can assist someone with a callback request. Real delegated access would require verified authorisation.</p><label class="row"><input type="checkbox" id="permission"> I have permission to assist in this fictional scenario.</label>${btn('Continue to request','caregiver-confirm','arrow')}</div>`);break;case'caregiver-confirm':if(!document.getElementById('permission').checked){toast('Confirm permission first.');return}closeModal();onAction('callback');break;case'toggle':if(['large','contrast','voiceAudio'].includes(v)){state[v]=!state[v];if(v==='voiceAudio'&&!state[v]&&'speechSynthesis'in window)speechSynthesis.cancel()}else state.availability[v]=!state.availability[v];update();break;case'save-availability':state.availability.slots=Math.max(0,Math.min(30,Math.floor(Number(document.getElementById('slots').value)||0)));state.availability.window=document.getElementById('window').value;update();toast('Availability updated across both portals.');break;case'review':review(v);break;case'accept':case'redirect':case'complete':case'rx':case'cancel':{const r=state.requests.find(x=>x.id===v);if(!r)return;if(k==='accept'&&r.status==='pending'){if(r.doctor===providers[0].name){if(!state.availability.on||state.availability.slots<1){toast('No available slots.');return}state.availability.slots--}r.status='accepted'}else if(k==='redirect'&&r.status==='pending')r.status='redirected';else if(k==='complete'&&r.status==='accepted')r.status='reviewed';else if(k==='rx'&&r.status==='reviewed'){r.status='prescribed';state.pharmacy='';state.delivery=0}else if(k==='cancel'&&['pending','accepted'].includes(r.status)){if(r.status==='accepted'&&r.doctor===providers[0].name)state.availability.slots++;r.status='cancelled'}else return;closeModal();update();toast({accept:'Callback confirmed. Patient portal updated.',redirect:'Request redirected. Patient portal updated.',complete:'Consultation marked reviewed.',rx:'Demo prescription available in patient portal.',cancel:'Request cancelled.'}[k]);break}case'reschedule':{const r=state.requests.find(x=>x.id===v);if(!r||r.status!=='pending')return;modal('Change preferred window',`<form id="reschedule-form" class="flow" data-id="${v}"><div class="field"><label for="reschedule-window">Preferred time</label><select id="reschedule-window"><option>Next working day</option><option>09:00–11:00</option><option>14:00–16:00</option></select></div><button class="btn full" type="submit">Save request</button></form>`);break}case'delivery-request':if(activeRx()&&state.pharmacy&&state.delivery===0){state.delivery=1;update();toast('Delivery request sent in the simulation.')}break;case'delivery-next':if(state.delivery>0&&state.delivery<4){state.delivery++;if(state.delivery===4){const r=activeRx();if(r)r.status='delivered'}update();toast(state.delivery===4?'Simulated handover complete.':'Delivery status updated.')}break;case'voice-start':if(!voiceRunning&&voiceIndex<conversation().length){voiceRunning=true;voiceStep()}break;case'voice-next':if(!voiceRunning)voiceStep();break;case'voice-pause':stopVoice();render();break;case'voice-replay':stopVoice();voiceIndex=0;render();break;case'voice-send':if(voiceIndex===conversation().length&&state.availability.on&&state.availability.new&&state.availability.slots>0&&!state.requests.some(r=>r.source==='Landline demo'&&r.status!=='cancelled')){addRequest({name:'Maria Schneider',callback:'000 000000',doctor:providers[0].name,type:'Telephone',window:state.availability.window,reason:'Routine follow-up; family doctor retired; no transport available.',postal:'97469',source:'Landline demo'});render();toast('Request sent to the doctor inbox.')}break;case'notifications':modal('Your notifications',`<div class="flow">${state.requests.length?[...state.requests].reverse().map(r=>`<div class="summary"><h3>${esc(r.name)} · ${esc(statusName(r.status))}</h3><p class="small muted">${esc(r.window)} · ${esc(r.source)}</p></div>`).join(''):'<p class="muted">No notifications yet. Send a request to begin.</p>'}</div>`);break;case'reset':modal('Reset the demo?',`<div class="flow"><p>This clears all fictional requests, delivery progress and settings in this browser.</p>${btn('Reset demo data','reset-confirm','refresh')}${btn('Keep my demo','close','','outline')}</div>`);break;case'reset-confirm':stopVoice();state=initial();voiceIndex=0;postal='97469';filter='all';guestMode=false;save();go('patient','home');toast('Demo reset. Ready for your next presentation.');break;case'close':closeModal();break;}}
document.addEventListener('click',e=>{const target=e.target.closest('[data-act]');if(!target||target.disabled)return;if(target.dataset.act==='backdrop'){if(e.target===target)closeModal();return}onAction(target.dataset.act)});document.addEventListener('submit',e=>{if(e.target.id==='booking-form'){e.preventDefault();const p=providers[selectedProvider];if(selectedProvider===0&&(!state.availability.on||state.availability.slots<1)){closeModal();go('patient','find');toast('Practice capacity changed. Choose another doctor.');return}addRequest({name:document.getElementById('patient-name').value.trim()||'Demo patient',callback:document.getElementById('callback-number').value,doctor:p.name,type:document.getElementById('type').value,window:document.getElementById('time').value,reason:document.getElementById('reason').value,postal,source:guestMode?'GuestCare':'Patient portal'});go('patient','appointments');toast('Request sent. Waiting for practice confirmation.')}else if(e.target.id==='reschedule-form'){e.preventDefault();const r=state.requests.find(x=>x.id===e.target.dataset.id);if(r){r.window=document.getElementById('reschedule-window').value;closeModal();update();toast('Preferred window updated.')}}});document.addEventListener('change',e=>{if(e.target.id==='pharmacy'){state.pharmacy=e.target.value;update()}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.id==='postal'){e.preventDefault();onAction('search')}if(e.key==='Tab'&&document.querySelector('.modal')){const focus=[...document.querySelectorAll('.modal button:not(:disabled),.modal input:not(:disabled),.modal select:not(:disabled),.modal textarea:not(:disabled),.modal a[href]')];if(!focus.length)return;const first=focus[0],last=focus.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render();
</script></body></html>
